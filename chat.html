<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>투표 최종 결과</title>
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>
    <header class="main-header">
        <div class="header-row">
            <h2>GSITM 부트캠프 10기 부식 신청</h2>
            <span class="header-user">유저</span>
        </div>
    </header>
    <div class="back-arrow"></div>
    <h1>투표 최종 결과</h1>
    <div class="menu-title">선정된 menu</div>
    <table class="scroll-table">
        <thead>
            <tr>
                <th class="rank">순위</th>
                <th class="product">제품명</th>
                <th>투표율</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>
                    <a href="#">포카칩.</a>
                    <span title="댓글">
                        <a>
                            <i class="fa-regular fa-face-smile"></i></a>
                    </span>
                    <div class="vote-comments">
                        고서영: 맛있어요, 김진령령: 내가 더 좋아합니다., 김상준: 나!!!!, 백승진: 사브브
                    </div>
                </td>
                <td>
                    <span class="vote-bar-bg">
                        <span class="vote-bar" style="width:60%;"></span>
                    </span>
                    60% <span style="color:#888;">6표</span>
                </td>
            </tr>
            <tr>
                <td>2</td>
                <td>홈런볼</td>
                <td></td>
            </tr>
            <tr>
                <td>3</td>
                <td>…</td>
                <td></td>
            </tr>
            <tr>
                <td>4</td>
                <td>…</td>
                <td></td>
            </tr>
            <tr>
                <td>5</td>
                <td>…</td>
                <td></td>
            </tr>
            <tr>
                <td>6</td>
                <td>…</td>
                <td></td>

        </tbody>
    </table>
    <div class="total">총계: ₩ 42,400</div>
    <div class="chat-box">
        <div class="input-row">
            <input type="text" placeholder="이름" style="width:70px;">
            <input type="password" placeholder="비밀번호" style="width:100px;">
        </div>
        <div class="chat-entry">
            <span class="chat-x">&#10006;</span>
            <span class="chat-bubble">눈의 솔을 마시고 싶어요…</span>
        </div>
        <div class="chat-entry">
            <span class="chat-x">&#10006;</span>
            <span class="chat-bubble">그건 좀….</span>
        </div>
        <div class="chat-entry">
            <span class="chat-x">&#10006;</span>
            <span class="chat-bubble">…</span>
        </div>
        <div class="chat-entry chat-right">
            <span class="chat-bubble chat-bubble-right">…</span>
        </div>
        <form style="margin-top:10px;">
            <input class="message-input" type="text" placeholder="메시지를 입력 하십시오">
            <button type="submit" class="send-btn">전송</button>
        </form>
    </div>
</body>

</html>
